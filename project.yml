name: SwiftShield
options:
  bundleIdPrefix: com.swiftshield
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ru
  xcodeVersion: "27.0"

packages:
  SwiftShieldCore:
    path: Packages/SwiftShieldCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 2
    MARKETING_VERSION: 0.2.0
    CODE_SIGN_STYLE: Automatic

targets:
  SwiftShield:
    type: application
    platform: iOS
    sources:
      - App
    resources:
      - App/Resources
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: SwiftShield VPN
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.swiftshield.app
            CFBundleURLSchemes:
              - swiftshield
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/App.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.swiftshield.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftshield.app
        PRODUCT_NAME: SwiftShield
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: false
    dependencies:
      - package: SwiftShieldCore
      - target: TunnelExtension
        embed: true
      - target: SwiftShieldWidgets
        embed: true

  SwiftShieldWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
    info:
      path: Config/Widgets-Info.plist
      properties:
        CFBundleDisplayName: SwiftShield
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.swiftshield.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftshield.app.Widgets
        PRODUCT_NAME: SwiftShieldWidgets
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - package: SwiftShieldCore

  TunnelExtension:
    type: app-extension
    platform: iOS
    sources:
      - TunnelExtension
    info:
      path: Config/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: SwiftShield Tunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: Config/Tunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension:
          - packet-tunnel-provider
        com.apple.security.application-groups:
          - group.com.swiftshield.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftshield.app.TunnelExtension
        PRODUCT_NAME: TunnelExtension
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
    dependencies:
      - package: SwiftShieldCore
      - framework: Vendor/Libbox.xcframework
        embed: false
      - sdk: UIKit.framework
      - sdk: libresolv.tbd

schemes:
  SwiftShield:
    build:
      targets:
        SwiftShield: all
        TunnelExtension: all
        SwiftShieldWidgets: all
    run:
      config: Debug
    archive:
      config: Release
